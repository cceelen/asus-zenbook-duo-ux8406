# The project and package names are those of packaging/obs/README.md.
version: '1.0'

# A pushed tag v* builds the packages of that tag in the :releases project,
# one OBS package per tag (asus-zenbook-duo-ux8406-v0.1.0, ...).
release:
  steps:
    - branch_package:
        source_project: home:cceelen:asus-zenbook-duo-ux8406
        source_package: asus-zenbook-duo-ux8406
        target_project: home:cceelen:asus-zenbook-duo-ux8406:releases
  filters:
    event: tag_push

# No workflow for pull requests: see "Pull requests" in packaging/obs/README.md.
