# The project and package names are those of packaging/obs/README.md.
version: '1.0'

# A new tag v* makes the package fetch the recipes of that tag and the archive
# of its release, and build. The tag is made when the release is published.
release:
  steps:
    - trigger_services:
        project: home:cceelen:asus-zenbook-duo-ux8406
        package: asus-zenbook-duo-ux8406
  filters:
    event: tag_push

# No workflow for pull requests: a pull request has no release archive.
