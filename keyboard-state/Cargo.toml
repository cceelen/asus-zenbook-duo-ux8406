[package]
name = "asus-ux8406-keyboard-state"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backlight and function row of the ASUS Zenbook Duo UX8406 keyboard, kept from one connection to the next"
publish = false

[dependencies]
# Version 0.15 needs Rust 1.98, and Debian 13 (backports) has 1.96. Remove the
# upper limit when rust-version is 1.98.
aya = { version = "0.14", default-features = false }
clap = { version = "4", features = ["derive"] }
# Sends the feature report that sets the backlight, over hidraw. Pure Rust: no
# libudev and no libusb to link.
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev"] }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
# The root test makes a BPF map: aya takes the description of one from here.
aya-obj = "0.3"
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
rstest = "0.28"

[lints]
workspace = true
