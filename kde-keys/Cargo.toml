[package]
name = "asus-ux8406-kde-keys"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lower screen key and touchscreen mapping of the ASUS Zenbook Duo UX8406 in KDE Plasma"
publish = false

[dependencies]
asus-ux8406-kde-common = { path = "../kde-common" }
calloop = "0.14"
clap = { version = "4", features = ["derive"] }
log = "0.4"
thiserror = "2"
zbus = "5"

[dev-dependencies]
# Not used directly: assert_fs brings it in. Version 0.4.30 needs Rust 1.88 but
# does not declare it, and Debian 13 has 1.85. Later versions declare it, and
# cargo does not select them. Remove this line when rust-version is 1.88.
ignore = ">=0.4.25, <0.4.30"
asus-ux8406-kde-fakes = { path = "../kde-fakes" }
assert_fs = "1"
rstest = "0.28"
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
