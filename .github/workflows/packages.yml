# The packages of each distribution, from the source archive of a release
# (release-archive.yml; in a release, the one that release-files.yml attests):
# built and linted in a container of the
# distribution (rpmlint, lintian, namcap, apkbuild-lint), then installed on a
# clean container of the same image, checked and removed. Nix builds the
# packages of the flake on the runner. A linter error or a failed step fails
# the job.
#
# The jobs run the scripts of dev/containers/ (build-deps.sh, build.sh,
# install.sh, check.sh) directly in a job container: no image is built.
# The Dockerfiles there run the same scripts, for local builds.
#
# By hand ("Run workflow"), and in release.yml after the release pull
# request: a failed build stops the publication.
name: packages

on:
  workflow_call:
    inputs:
      archive:
        description: >-
          The artifact of this run with the source archive (release.yml gives
          release-source, from release-files.yml). Empty: this workflow
          makes the archive.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Only without an archive from the caller: two jobs of one run cannot
  # upload an artifact of the same name.
  archive:
    if: ${{ !inputs.archive }}
    uses: ./.github/workflows/release-archive.yml

  # The builds, one list for the build jobs and the install jobs. Each one:
  # the image, read from the FROM line of its Dockerfile (pinned by digest,
  # which Renovate updates there), the family for the scripts, and the
  # packages that the install job installs (keyboard, GNOME, KDE).
  matrix:
    runs-on: ubuntu-26.04
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: matrix
        run: |
          # The image of the stage STAGE of dev/containers/FILE.Dockerfile.
          image() {
            ref=$(sed -n "s/^FROM \([^ ]*\) AS $2\$/\1/p" "dev/containers/$1.Dockerfile")
            [ -n "$ref" ] || { echo "::error::no stage $2 in $1.Dockerfile"; exit 1; }
            echo "$ref"
          }
          build() {
            [ -n "$3" ] || exit 1
            jq -nc --arg name "$1" --arg family "$2" --arg image "$3" \
              --arg keyboard "$4" --arg gnome "$5" --arg kde "$6" \
              '{$name, $family, $image, $keyboard, $gnome, $kde}'
          }
          {
            build fedora fedora "$(image fedora base)" yes yes yes
            # No udev-hid-bpf in Tumbleweed, Debian 13 and Alpine: second-screen
            # and guard only.
            build opensuse opensuse "$(image opensuse base)" no no no
            build debian debian "$(image debian base-trixie)" no no no
            build debian-testing debian "$(image debian base-testing)" yes no no
            build arch arch "$(image arch base)" yes yes yes
            build alpine alpine "$(image alpine base)" no no no
          } | jq -sc . > "$RUNNER_TEMP/include.json"
          cat "$RUNNER_TEMP/include.json"
          echo "include=$(cat "$RUNNER_TEMP/include.json")" >> "$GITHUB_OUTPUT"

  build:
    needs: [archive, matrix]
    # archive is skipped when the caller gives the archive.
    if: ${{ !cancelled() && needs.matrix.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.archive.result) }}
    name: build (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      FAMILY: ${{ matrix.family }}
    defaults:
      run:
        shell: sh
    steps:
      # git for actions/checkout: without it, the action needs tar and gzip,
      # which not every image has.
      - run: |
          case "$FAMILY" in
            fedora) dnf install -y git ;;
            # gawk: else git brings busybox-gawk, which rpm-build cannot use.
            opensuse) zypper -n install --no-recommends git-core gawk ;;
            debian) apt-get update -q && apt-get install -qy --no-install-recommends git ca-certificates ;;
            arch) pacman -Sy --noconfirm --needed git ;;
            alpine) apk add git ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.archive || 'release-source' }}
          path: dist
      - run: sh dev/containers/build-deps.sh "$FAMILY"
      # As the user that build-deps.sh made: rpmbuild, makepkg and abuild run
      # without root. The job container has network; cargo must not use it:
      # a crate that is not in vendor/ of the archive fails the build here,
      # as it would on the build services of the distributions.
      - run: |
          chown -R builder .
          su builder -c "CARGO_NET_OFFLINE=true sh dev/containers/build.sh $FAMILY dist/asus-zenbook-duo-ux8406-*.tar.gz out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  # On a clean container of the same image: the package manager installs
  # the packages and gets their run-time dependencies, and check.sh checks
  # the installed files and the programs and removes the packages.
  install:
    needs: [matrix, build]
    # Explicit: the default condition skips this job when archive, a job
    # before build, is skipped.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    name: install (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      FAMILY: ${{ matrix.family }}
      KEYBOARD: ${{ matrix.keyboard }}
      GNOME: ${{ matrix.gnome }}
      KDE: ${{ matrix.kde }}
    defaults:
      run:
        shell: sh
    steps:
      - run: |
          case "$FAMILY" in
            fedora) dnf install -y git ;;
            # gawk: else git brings busybox-gawk, which rpm-build cannot use.
            opensuse) zypper -n install --no-recommends git-core gawk ;;
            debian) apt-get update -q && apt-get install -qy --no-install-recommends git ca-certificates ;;
            arch) pacman -Sy --noconfirm --needed git ;;
            alpine) apk add git ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ matrix.name }}
          path: pkgs
      - run: sh dev/containers/install.sh "$FAMILY" pkgs
      - run: sh dev/containers/check.sh "$FAMILY"

  # The packages of the flake, all in one build at the same time; then a link
  # to each part, which check-nix.sh checks.
  nix:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: |
          parts="second-screen:asus-zenbook-duo-ux8406-second-screen tcc-guard:asus-zenbook-duo-ux8406-tcc-guard
                 keyboard-bpf:asus-zenbook-duo-ux8406-keyboard-bpf
                 gnome-keys:gnome-shell-extension-asus-zenbook-duo-ux8406-keys
                 gnome-rotation:gnome-shell-extension-builtin-screen-rotation
                 kde-shortcuts:asus-zenbook-duo-ux8406-kde-shortcuts
                 kde-keys:asus-zenbook-duo-ux8406-kde-keys
                 kde-rotation:plasma-builtin-screen-rotation"
          # shellcheck disable=SC2046
          nix build -L --no-link --max-jobs auto $(for p in $parts; do echo ".#${p#*:}"; done)
          mkdir results
          for p in $parts; do
            nix build --out-link "results/${p%%:*}" ".#${p#*:}"
          done
      - run: sh dev/containers/check-nix.sh results
