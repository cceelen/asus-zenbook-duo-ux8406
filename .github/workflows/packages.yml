# The packages of each distribution, built in a container from this tree
# (dev/containers/compose.yaml): the linter of the distribution (rpmlint,
# lintian, namcap, apkbuild-lint) on the recipe and on the packages,
# installation on a clean system, a check of the installed files, and
# removal. A linter error or a failed step fails the job.
#
# By hand ("Run workflow"), and in release.yml before the publication: a
# failed build stops the release.
name: packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, opensuse, debian, debian-testing, arch, alpine, nix]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # BuildKit keeps the layers in the Actions cache, one scope for each
      # distribution: the layers that install the build tools are made
      # again only when the base image or the Dockerfile changes. The
      # Actions cache drops what no run used for 7 days.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: dev/containers/compose.yaml
          targets: ${{ matrix.distro }}
          load: true
          set: |
            *.context=.
            *.tags=asus-zenbook-duo-ux8406-packages-${{ matrix.distro }}
            *.cache-from=type=gha,scope=packages-${{ matrix.distro }}
            *.cache-to=type=gha,scope=packages-${{ matrix.distro }},mode=max,ignore-error=true
      - env:
          DISTRO: ${{ matrix.distro }}
        run: >-
          docker compose -f dev/containers/compose.yaml up --no-build
          --exit-code-from "$DISTRO" "$DISTRO"
