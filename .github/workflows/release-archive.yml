# The source archive of a release: the tree and the crates in vendor/, from
# `meson dist`. release-files.yml calls it for a release, and ci.yml for each
# pull request; it needs no right to write.
name: release-archive
on:
  workflow_call:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends meson
      - run: meson setup build -Dscreen=false -Dguard=false -Dkeyboard=false -Dgnome=false -Drotation=false -Dkde_shortcuts=false -Dkde=false -Dkde_rotation=false
      - run: meson dist -C build --no-tests --formats gztar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # release-*: release.yml puts these files on the release.
          name: release-source
          path: build/meson-dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
