# A merge request to Alpine's aports for a release, from the fork of a
# service account. Alpine's CI builds it; an Alpine developer reviews and
# merges it, and Alpine's builders then build and sign the packages. No
# maintained template makes aports merge requests, so the steps are written
# here.
#
# release.yml calls it after the publication. It can also be started by
# hand for a published tag, for example when a run failed.
#
# The job runs in an Alpine container, with the tools from apk. abuild runs
# as root there (-F); the container is used once.
#
# No git: the bot protection of gitlab.alpinelinux.org refuses git over
# HTTPS from CI runners (HTTP 418), and over SSH it held the clone of
# aports open without data. The job makes the branch and its commit through
# the API, with the token, from the master branch of upstream; glab opens
# the merge request through the API too.
#
# There is one merge request at a time, from one fixed branch. A new release
# replaces the branch, and so updates an open merge request.
name: aports
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, for example v0.4.0.
        type: string
        required: true
    # The job reads the secrets in the environment aports; a secret of the
    # environment takes the place of one that the caller passes.
    secrets:
      APORTS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag, for example v0.4.0.
        type: string
        required: true
permissions:
  contents: read
# One run at a time: two runs would write the same branch.
concurrency:
  group: aports
  cancel-in-progress: false
jobs:
  aports:
    if: ${{ vars.APORTS_FORK != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container: docker.io/library/alpine:edge@sha256:020dfcbaaf4cc1078bf2d9c7ba31a8466e334061dcd2f248001d68f79e52c000
    environment: aports
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      FORK: ${{ vars.APORTS_FORK }}
      # testing/ until Alpine moves the aport to community/. The directory has
      # the name of pkgname in the APKBUILD, as aports wants.
      APORT: ${{ vars.APORTS_DIR || 'testing' }}/asus-zenbook-duo-ux8406-second-screen
      BRANCH: asus-zenbook-duo-ux8406
    steps:
      # The token. Without it, the job stops here and names it.
      - env:
          TOKEN: ${{ secrets.APORTS_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::APORTS_TOKEN is not set"; exit 1; }
      # Before the checkout, so that it uses git.
      - run: apk add --no-cache abuild atools curl git github-cli glab jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          path: tree
      # The archive that abuild checksum hashes is the attested one.
      - run: |
          gh release download "$TAG" --pattern 'asus-zenbook-duo-ux8406-*.tar.gz' --dir distfiles
          gh attestation verify distfiles/*.tar.gz --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release-files.yml"
      - run: |
          mkdir aport
          cp tree/packaging/alpine/* aport/
          cd aport
          SRCDEST="$GITHUB_WORKSPACE/distfiles" abuild -F checksum
          apkbuild-lint APKBUILD
          abuild -F validate
      # One commit with the files of the aport, on the branch of the fork,
      # made from the master branch of upstream (force: a new release
      # replaces the branch). Each file is created, updated or deleted, as
      # upstream has it or not. The author is the maintainer of the
      # APKBUILD. The title is the one that aports wants for a new or an
      # upgraded aport.
      - env:
          TOKEN: ${{ secrets.APORTS_TOKEN }}
        run: |
          api=https://gitlab.alpinelinux.org/api/v4
          get() { curl -sS --fail-with-body --retry 3 --retry-all-errors -H "PRIVATE-TOKEN: $TOKEN" "$api/$1"; }
          enc() { printf '%s' "$1" | jq -sRr @uri; }
          upstream=$(get "projects/$(enc alpine/aports)" | jq -r .id)
          # The files of the aport upstream; none for a new aport (404).
          existing=$(curl -sS --retry 3 --retry-all-errors -H "PRIVATE-TOKEN: $TOKEN" \
            "$api/projects/$upstream/repository/tree?ref=master&per_page=100&path=$(enc "$APORT")" \
            | jq -r 'if type == "array" then .[] | select(.type == "blob") | .name else empty end')
          version=${TAG#v}
          if printf '%s\n' "$existing" | grep -qx APKBUILD; then
            title="$APORT: upgrade to $version"
          else
            title="$APORT: new aport"
          fi
          {
            for f in aport/*; do
              name=${f##*/}
              if printf '%s\n' "$existing" | grep -qx "$name"; then action=update; else action=create; fi
              jq -n --arg action "$action" --arg path "$APORT/$name" --arg content "$(base64 -w 0 < "$f")" \
                '{$action, file_path: $path, $content, encoding: "base64"}'
            done
            for name in $existing; do
              [ -e "aport/$name" ] || jq -n --arg path "$APORT/$name" '{action: "delete", file_path: $path}'
            done
          } | jq -s . > actions.json
          author=$(sed -n 's/^# Maintainer: //p' aport/APKBUILD)
          email=${author##*<}
          jq -n --arg branch "$BRANCH" --argjson start "$upstream" --arg title "$title" \
            --arg name "${author% <*}" --arg email "${email%>}" --slurpfile actions actions.json \
            '{branch: $branch, start_project: $start, start_branch: "master", force: true,
              commit_message: $title, author_name: $name, author_email: $email, actions: $actions[0]}' > commit.json
          curl -sS --fail-with-body --retry 3 --retry-all-errors -X POST -H "PRIVATE-TOKEN: $TOKEN" \
            -H 'Content-Type: application/json' --data @commit.json \
            "$api/projects/$(enc "$FORK")/repository/commits" | jq -r '"commit: \(.web_url)"'
          echo "TITLE=$title" >> "$GITHUB_ENV"
      # A new merge request, or a new title for the open one. If the API is
      # not reachable, the branch is on the fork: the log gives the link that
      # opens the merge request by hand.
      - env:
          GITLAB_HOST: gitlab.alpinelinux.org
          GITLAB_TOKEN: ${{ secrets.APORTS_TOKEN }}
        run: |
          url="https://github.com/$GH_REPO/releases/tag/$TAG"
          if open=$(glab mr list --repo alpine/aports --source-branch "$BRANCH" --output json | jq -r '.[0].iid // empty'); then
            if [ -n "$open" ]; then
              glab mr update "$open" --repo alpine/aports --title "$TITLE" --description "$url" && exit 0
            else
              glab mr create --repo alpine/aports --head "$FORK" --source-branch "$BRANCH" \
                --target-branch master --title "$TITLE" --description "$url" \
                --remove-source-branch --yes && exit 0
            fi
          fi
          echo "::error::glab failed. Open the merge request by hand: https://gitlab.alpinelinux.org/$FORK/-/merge_requests/new?merge_request%5Bsource_branch%5D=$BRANCH"
          exit 1
