# Each night on main: the coverage of the three Rust programs and of the
# logic of the extensions, to the summary of the run and to Codecov, which
# shows main in its badge and graphs. Pull requests are measured in ci.yml,
# with the same steps; a rebase merge gives main other commits, so their
# reports are not those of main. It is measured, not a limit; the guard's
# limit of 100 % is in ci.yml. A night without a new commit on main measures
# nothing; a run by hand always measures.
name: coverage

on:
  schedule:
    - cron: "53 1 * * *"
  workflow_dispatch:

concurrency:
  group: coverage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Whether main has a commit of the last 25 hours.
  changed:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$EVENT" != schedule ] || [ "$age" -lt 90000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No commit on main since the last night: nothing to measure."
          fi

  # One measurement of the three programs, the guard with its fail points.
  # The clean removes data from an earlier run that the cache brought back.
  rust:
    needs: changed
    if: ${{ needs.changed.outputs.run == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov clean --workspace
      - run: cargo llvm-cov --locked --no-report -p asus-ux8406-tcc-guard --features failpoints
      - run: cargo llvm-cov --locked --no-report -p asus-ux8406-second-screen -p asus-ux8406-keyboard-state
      - run: |
          cargo llvm-cov report --ignore-filename-regex /tests/ --lcov --output-path rust.lcov
          {
            echo '### Rust coverage'
            echo '```text'
            cargo llvm-cov report --ignore-filename-regex /tests/ --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: rust.lcov
          retention-days: 7

  # Node's test runner over the logic tests of the extensions. The modules
  # that need a GNOME Shell (extension.js, display.js, sensor.js) are not
  # loaded by a test, so they are not in it.
  js:
    needs: changed
    if: ${{ needs.changed.outputs.run == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          node --test --experimental-test-coverage --test-coverage-exclude='**/tests/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=js.lcov \
            gnome-keys/tests/layout.test.js gnome-keys/tests/touch.test.js \
            gnome-rotation/tests/rotation.test.js | tee js.txt
          {
            echo '### Coverage of the extensions'
            echo '```text'
            sed -n '/start of coverage report/,/end of coverage report/p' js.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-js
          path: js.lcov
          retention-days: 7

  # To Codecov; a failed upload does not fail the run. Only this job has
  # the token; it runs nothing from the tree.
  upload:
    needs: [rust, js]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust.lcov,coverage/js.lcov
          disable_search: true
          fail_ci_if_error: false
