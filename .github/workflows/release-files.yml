# Makes the file of a release: the source archive (the tree and the crates in
# vendor/). With `release: true` it attests it and keeps the Sigstore bundle.
# Reusable, so that a caller cannot add steps to the build or signing jobs.
name: release-files
on:
  workflow_call:
    inputs:
      release:
        description: Attest the files. Only release.yml sets it.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends meson
      - run: meson setup build -Dscreen=false -Dguard=false -Dkeyboard=false -Dgnome=false -Drotation=false
      - run: meson dist -C build --no-tests --formats gztar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # release-*: release.yml puts these files on the release.
          name: release-source
          path: build/meson-dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
  # Alone with the right to sign, and it runs nothing that the builds made.
  attest:
    if: ${{ inputs.release }}
    needs: archive
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # download-artifact checks each file against the digest recorded at
      # upload.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-source
          path: files
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: files/*
      # The Sigstore bundle of the attestation, next to the archive on the
      # release: `gh attestation verify --bundle` checks it without the
      # attestation API.
      - env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir signature
          for f in files/*; do
            cp "$BUNDLE" "signature/$(basename "$f").sigstore.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # release-*: release.yml puts these files on the release.
          name: release-signature
          path: signature/*.sigstore.json
          if-no-files-found: error
