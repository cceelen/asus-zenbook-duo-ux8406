# Once a week: which distributions package udev-hid-bpf. It gates nothing.
# The weekly run of ci.yml checks the dependencies for new advisories.
name: watch

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Who packages udev-hid-bpf, which the keyboard package needs. Repology asks
  # clients to say who they are.
  repology:
    runs-on: ubuntu-26.04
    steps:
      - run: >-
          curl -fsS -A "asus-zenbook-duo-ux8406-watch (+https://github.com/$GITHUB_REPOSITORY)"
          https://repology.org/api/v1/project/udev-hid-bpf
          | jq -r '.[] | "- \(.repo): \(.version) (\(.status // "-"))"'
          >> "$GITHUB_STEP_SUMMARY"
