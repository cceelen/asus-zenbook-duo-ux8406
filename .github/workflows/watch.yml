# Once a week: the long fuzz runs, and which distributions package
# udev-hid-bpf. It gates nothing: a red run is the notice.
# The weekly run of ci.yml checks the dependencies for new advisories.
name: watch

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The parsers of the guard's inputs (fuzz/), a quarter of an hour each. The
  # corpus is not kept between runs.
  fuzz:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: nightly
          cache-workspaces: fuzz
      # The corpus of the last run, which the end of this job saves.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: cargo install --locked cargo-fuzz@0.13.2
      # cargo fuzz has no --locked: the runs below use fuzz/Cargo.lock as it
      # is.
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: |
          # fuzz/seeds: a start for each target, from the tests' cases.
          for target in $(cargo fuzz list); do
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" \
              -- -max_total_time=900
          done
      # Only what adds coverage is kept. Saved also after a failure: what
      # led there is worth keeping. Only main saves, on its weekly run, so a
      # pull request never fills the cache that the others read.
      - if: ${{ !cancelled() }}
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz cmin "$target" "fuzz/corpus/$target"
          done
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

  # Who packages udev-hid-bpf, which the keyboard package needs. Repology asks
  # clients to say who they are.
  repology:
    runs-on: ubuntu-26.04
    steps:
      - run: >-
          curl -fsS -A "asus-zenbook-duo-ux8406-watch (+https://github.com/$GITHUB_REPOSITORY)"
          https://repology.org/api/v1/project/udev-hid-bpf
          | jq -r '.[] | "- \(.repo): \(.version) (\(.status // "-"))"'
          >> "$GITHUB_STEP_SUMMARY"
