# A tag v* makes the release files, attests them and creates a draft
# release. COPR and OBS take the archive from the published release.
name: release
on:
  push:
    tags: ["v*"]
# Two tags in quick succession are two releases; none is cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release-files:
    uses: ./.github/workflows/release-files.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      release: true
  # The only job that may write to the repository.
  publish:
    needs: release-files
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      # The tag is the version in Cargo.toml.
      - run: test "$GITHUB_REF_NAME" = "v$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
      # The check a user makes.
      - run: >-
          gh attestation verify release/asus-zenbook-duo-ux8406-*.tar.gz --repo "$GH_REPO"
          --signer-workflow "$GH_REPO/.github/workflows/release-files.yml"
          --source-ref "$GITHUB_REF"
      # gh is on the runner: no third-party code in the one job that writes.
      - run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
