# Checks every pull request. The ruleset of main requires these checks and
# a branch that is up to date, so the tree that a merge puts on main is the
# tree that the pull request run checked: a push to main runs nothing here.
#
# Once a week the checks run on main: for what changes without a commit (new
# lints of stable Rust, new advisories), and so that pull requests find the
# caches of main.
name: ci

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch or pull request makes the older run
# pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-26.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      # Without the cache service, rustc compiles as without sccache.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # sccache keeps what rustc compiles in the Actions cache: a crate that
      # did not change is not compiled again, also a crate of this workspace.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - uses: ./.github/actions/rust
        with:
          components: clippy, rustfmt, llvm-tools-preview
          cache-workspaces: |
            .
            fuzz
      # Prebuilt binaries: building the two from source took longer than the
      # checks.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov,cargo-about
      # The hooks cargo-fmt and cargo-clippy of .pre-commit-config.yaml, here
      # with the toolchain and its cache; the pre-commit job skips them.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p asus-ux8406-tcc-guard --all-targets --features failpoints -- -D warnings
      # The fuzz targets are a workspace of their own (fuzz/). They are run
      # only in fuzz.yml, each night; here they are checked as code.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      # fuzz/ has no lock file of its own: it starts from the one of the
      # tree, so the guard's crates have the versions that ship, and cargo
      # adds the crates of the fuzz targets.
      - run: cp Cargo.lock fuzz/Cargo.lock
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      # Coverage of the three programs: one measurement, read twice. Every
      # region of the guard is run by a test (the limit); second-screen and
      # keyboard-state are measured for the report only. The clean removes
      # data from an earlier run that the cache brought back.
      - run: cargo llvm-cov clean --workspace
      - run: cargo llvm-cov --locked --no-report -p asus-ux8406-tcc-guard --features failpoints
      - run: cargo llvm-cov --locked --no-report -p asus-ux8406-second-screen -p asus-ux8406-keyboard-state
      - run: >-
          cargo llvm-cov report --ignore-filename-regex '/tests/|second-screen/|keyboard-state/'
          --fail-under-regions 100
      - run: |
          cargo llvm-cov report --ignore-filename-regex /tests/ --lcov --output-path rust.lcov
          {
            echo '### Rust coverage'
            echo '```text'
            cargo llvm-cov report --ignore-filename-regex /tests/ --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: rust.lcov
          retention-days: 7
      # The committed notices are those of Cargo.lock. cargo-about reads the
      # crates of all programs, and the steps before got those of the guard.
      - run: cargo fetch --locked
      - run: cargo about generate --locked --offline -m keyboard-state/Cargo.toml about.hbs -o keyboard-state/THIRD-PARTY-NOTICES.txt
      - run: cargo about generate --locked --offline -m second-screen/Cargo.toml about.hbs -o second-screen/THIRD-PARTY-NOTICES.txt
      - run: cargo about generate --locked --offline -m tcc-guard/Cargo.toml about.hbs -o tcc-guard/THIRD-PARTY-NOTICES.txt
      - run: git diff --exit-code

  # The oldest Rust that a target distribution has (Debian 13). The crates of
  # Cargo.lock, those of the tests included, must compile with it. A check is
  # enough: the language and the library are those of the compiler front end.
  rust-oldest:
    runs-on: ubuntu-26.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - uses: ./.github/actions/rust
        with:
          toolchain: "1.85"
      - run: cargo check --locked --workspace --all-targets
      - run: cargo check --locked -p asus-ux8406-tcc-guard --all-targets --features failpoints

  # The weekly run on main also catches the advisories that appear without a
  # commit.
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false

  # Every hook of .pre-commit-config.yaml: formats, lints, spelling,
  # licences, one version in all files. cargo fmt and cargo clippy run in the
  # rust job.
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The environments of the hooks, made again only when the
      # configuration changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: >-
          sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends
          clang clang-tidy libbpf-dev linux-libc-dev pipx
      - run: pipx run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: cargo-fmt,cargo-clippy

  # Secrets in every commit of the history. The gitleaks hook of the
  # pre-commit job looks at staged changes only, and a checkout has none.
  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-secrets-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run gitleaks-history --hook-stage manual

  workflows:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

  # Ubuntu 26.04, not -latest: the HID-BPF program needs kernel headers of 6.10
  # or later (24.04 has 6.8). The runner's user is not root, which the tests
  # need. `meson test` runs the cargo tests, the BPF object checks and the
  # extension's node tests. The suite failpoints is left out: the rust job
  # runs the same tests with the fail points, for the coverage.
  meson:
    runs-on: ubuntu-26.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # Meson builds the crates into build/cargo.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> build/cargo
      - run: >-
          sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends
          meson ninja-build pkgconf clang libbpf-dev linux-libc-dev
          libglib2.0-bin systemd-dev udev
      - run: meson setup build -Dunit_checks=enabled
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs --no-suite failpoints
      # Coverage of the extensions' logic, for the report only. The modules
      # that need a GNOME Shell (extension.js, display.js, sensor.js) are not
      # loaded by a test, so they are not in it.
      - run: |
          node --test --experimental-test-coverage --test-coverage-exclude='**/tests/**' \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=js.lcov \
            gnome-keys/tests/layout.test.js gnome-keys/tests/touch.test.js \
            gnome-rotation/tests/rotation.test.js | tee js.txt
          {
            echo '### Coverage of the extensions'
            echo '```text'
            sed -n '/start of coverage report/,/end of coverage report/p' js.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-js
          path: js.lcov
          retention-days: 7

  # The coverage of the rust and meson jobs goes to Codecov. It is measured,
  # not a limit (the guard's 100 % is in the rust job), and a failed upload
  # does not fail the run. Only this job has the token; it runs nothing from
  # the tree.
  coverage:
    needs: [rust, meson]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust.lcov,coverage/js.lcov
          disable_search: true
          fail_ci_if_error: false

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # A called workflow may not ask for more permissions than its caller
  # grants. These are for its attest job, which does not run here.
  release-files:
    uses: ./.github/workflows/release-files.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
