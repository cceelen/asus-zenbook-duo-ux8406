# Checks every pull request. The ruleset of main requires these checks and
# a branch that is up to date, so the tree that a merge puts on main is the
# tree that the pull request run checked: a push to main runs nothing here.
#
# Once a week the checks run on main: for what changes without a commit (new
# lints of stable Rust, new advisories), and so that pull requests find the
# caches of main.
name: ci

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch or pull request makes the older run
# pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-26.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      # Only main writes, as for rust-cache (.github/actions/rust).
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      # Without the cache service, rustc compiles as without sccache.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # sccache keeps what rustc compiles in the Actions cache: a crate that
      # did not change is not compiled again, also a crate of this workspace.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - uses: ./.github/actions/rust
        with:
          components: clippy, rustfmt, llvm-tools-preview
          cache-workspaces: |
            .
            fuzz
      # The tests of the KDE crates start a private bus with dbus-daemon.
      - run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends dbus-daemon
      # Prebuilt binaries: building the two from source took longer than the
      # checks.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov,cargo-about
      # The hooks cargo-fmt and cargo-clippy of .pre-commit-config.yaml, here
      # with the toolchain and its cache; the pre-commit job skips them.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p asus-ux8406-tcc-guard --all-targets --features failpoints -- -D warnings
      # The fuzz targets are a workspace of their own (fuzz/). They are run
      # only in fuzz.yml, each night; here they are checked as code.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      # fuzz/ has no lock file of its own: it starts from the one of the
      # tree, so the guard's crates have the versions that ship, and cargo
      # adds the crates of the fuzz targets.
      - run: cp Cargo.lock fuzz/Cargo.lock
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      # Coverage of the five programs: one measurement, read twice. Every
      # region of the five is run by a test (the limit), and every branch of
      # all of them is in the job rust-branches. The clean removes data from
      # an earlier run that the cache brought back.
      # One step for the whole measurement: with the environment of
      # `cargo llvm-cov show-env`, the tests, the test that runs as root and
      # the report use one directory, so the data of the root test counts.
      # `shell: bash` gives pipefail.
      - shell: bash
        run: |
          eval "$(cargo llvm-cov show-env --sh)"
          cargo llvm-cov clean --workspace
          cargo test --locked -p asus-ux8406-tcc-guard --features failpoints
          cargo test --locked -p asus-ux8406-second-screen -p asus-ux8406-keyboard-state
          cargo test --locked -p asus-ux8406-kde-common -p asus-ux8406-kde-keys -p asus-ux8406-kde-rotation
          # The test of the state map makes a BPF map and pins it: that needs
          # root. Its binary is built as the user, and only it runs with sudo.
          bin=$(cargo test --locked -p asus-ux8406-keyboard-state --test root --no-run --message-format=json |
            jq -r 'select(.target.name == "root" and .executable != null) | .executable')
          sudo env LLVM_PROFILE_FILE="$LLVM_PROFILE_FILE" "$bin" --nocapture
          # kde-fakes is test code; kde-common/src/protocol.rs is generated.
          cargo llvm-cov report --ignore-filename-regex '/tests/|kde-fakes/|kde-common/src/protocol\.rs' --fail-under-regions 100
          cargo llvm-cov report --ignore-filename-regex '/tests/|kde-fakes/|kde-common/src/protocol\.rs' --lcov --output-path rust.lcov
          {
            echo '### Rust coverage'
            echo '```text'
            cargo llvm-cov report --ignore-filename-regex '/tests/|kde-fakes/|kde-common/src/protocol\.rs' --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: rust.lcov
          retention-days: 7
      # The committed notices are those of Cargo.lock. cargo-about reads the
      # crates of all programs, and the steps before got those of the guard.
      - run: cargo fetch --locked
      - run: cargo about generate --locked --offline -m keyboard-state/Cargo.toml about.hbs -o keyboard-state/THIRD-PARTY-NOTICES.txt
      - run: cargo about generate --locked --offline -m second-screen/Cargo.toml about.hbs -o second-screen/THIRD-PARTY-NOTICES.txt
      - run: cargo about generate --locked --offline -m tcc-guard/Cargo.toml about.hbs -o tcc-guard/THIRD-PARTY-NOTICES.txt
      - run: cargo about generate --locked --offline -m kde-keys/Cargo.toml about.hbs -o kde-keys/THIRD-PARTY-NOTICES.txt
      - run: cargo about generate --locked --offline -m kde-rotation/Cargo.toml about.hbs -o kde-rotation/THIRD-PARTY-NOTICES.txt
      - run: git diff --exit-code

  # The oldest Rust that a target distribution has (Debian 13). The crates of
  # Cargo.lock, those of the tests included, must compile with it. A check is
  # enough: the language and the library are those of the compiler front end.
  rust-oldest:
    runs-on: ubuntu-26.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - uses: ./.github/actions/rust
        with:
          toolchain: "1.89"
      - run: cargo check --locked --workspace --all-targets
      - run: cargo check --locked -p asus-ux8406-tcc-guard --all-targets --features failpoints

  # Every branch of the Rust programs is run by a test (the limit). Stable
  # rustc does not take the flag for the branch counters, so this job uses the
  # nightly compiler; the regions of the other measurement stay on stable. The
  # same runs as in the job rust.
  rust-branches:
    runs-on: ubuntu-26.04
    env:
      # A new lint of the nightly compiler is no reason to fail this job.
      CARGO_BUILD_WARNINGS: allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          # A nightly of a fixed date: the branch counters and the flag
          # --branch are unstable, and a required check must give the same
          # result for the same commit. Moved forward on purpose (refer to
          # CONTRIBUTING.md).
          toolchain: nightly-2026-11-04
          components: llvm-tools-preview
      # The tests of the KDE crates start a private bus with dbus-daemon.
      - run: sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends dbus-daemon
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      # One step for the whole measurement: with the environment of
      # `cargo llvm-cov show-env`, the tests, the test that runs as root and
      # the report use one directory, so the data of the root test counts.
      # `shell: bash` gives pipefail.
      - shell: bash
        run: |
          eval "$(cargo llvm-cov show-env --sh --branch)"
          cargo llvm-cov clean --workspace
          cargo test --locked -p asus-ux8406-tcc-guard --features failpoints
          cargo test --locked -p asus-ux8406-second-screen -p asus-ux8406-keyboard-state
          cargo test --locked -p asus-ux8406-kde-common -p asus-ux8406-kde-keys -p asus-ux8406-kde-rotation
          # The test of the state map makes a BPF map and pins it: that needs
          # root. Its binary is built as the user, and only it runs with sudo.
          bin=$(cargo test --locked -p asus-ux8406-keyboard-state --test root --no-run --message-format=json |
            jq -r 'select(.target.name == "root" and .executable != null) | .executable')
          sudo env LLVM_PROFILE_FILE="$LLVM_PROFILE_FILE" "$bin" --nocapture
          # cargo-llvm-cov has no limit for branches: the summary says how
          # many are not run.
          cargo llvm-cov report --branch --ignore-filename-regex '/tests/|kde-fakes/|kde-common/src/protocol\.rs' \
            --json --summary-only --output-path branches.json
          jq '.data[0].totals.branches' branches.json
          jq -e '.data[0].totals.branches.notcovered == 0' branches.json

  # The weekly run on main also catches the advisories that appear without a
  # commit.
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false

  # Every hook of .pre-commit-config.yaml: formats, lints, spelling,
  # licences, one version in all files. cargo fmt and cargo clippy run in the
  # rust job.
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The environments of the hooks, made again only when the
      # configuration changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: ./.github/actions/apt
        with:
          name: pre-commit
          packages: clang clang-tidy libbpf-dev linux-libc-dev pipx
      - run: pipx run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: cargo-fmt,cargo-clippy

  # Secrets in every commit of the history. The gitleaks hook of the
  # pre-commit job looks at staged changes only, and a checkout has none.
  secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-secrets-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run gitleaks-history --hook-stage manual

  workflows:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

  # Ubuntu 26.04, not -latest: the HID-BPF program needs kernel headers of 6.10
  # or later (24.04 has 6.8). The runner's user is not root, which the tests
  # need. `meson test` runs the cargo tests, the BPF object checks and the
  # extension's node tests. The suite failpoints is left out: the rust job
  # runs the same tests with the fail points, for the coverage.
  meson:
    runs-on: ubuntu-26.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      # Meson builds the crates into build/cargo.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> build/cargo
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/apt
        with:
          name: meson
          packages: >-
            meson ninja-build pkgconf clang llvm libbpf-dev linux-libc-dev
            libglib2.0-bin systemd-dev udev dbus-daemon
      - run: meson setup build -Dunit_checks=enabled -Dhost_checks=enabled -Dcargo_tests=enabled
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs --no-suite failpoints
      # Coverage of the extensions' logic, with a limit of 100 % of lines,
      # branches and functions. The modules that need a GNOME Shell
      # (extension.js, display.js, sensor.js) are not loaded by a test, so they
      # are not in it.
      # `shell: bash` gives pipefail: without it, the step has the exit
      # status of tee, and a test or the limit that fails passes.
      - shell: bash
        run: |
          node --test --experimental-test-coverage --test-coverage-exclude='**/tests/**' \
            --test-coverage-lines=100 --test-coverage-branches=100 --test-coverage-functions=100 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=js.lcov \
            gnome-keys/tests/layout.test.js gnome-keys/tests/touch.test.js \
            gnome-keys/tests/vectors.test.js gnome-rotation/tests/hold.test.js gnome-rotation/tests/rotation.test.js \
            gnome-rotation/tests/vectors.test.js kde-keys/tests/script.test.js | tee js.txt
          {
            echo '### Coverage of the extensions'
            echo '```text'
            sed -n '/start of coverage report/,/end of coverage report/p' js.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-js
          path: js.lcov
          retention-days: 7
      # The HID-BPF program's host harness: 100 % of its lines, functions and
      # branches (llvm-cov), the sanitizers, and the mutants. The full run
      # above includes them; naming them here fails the job if llvm is missing
      # and the coverage test was not registered.
      - run: meson test -C build --print-errorlogs host host-sanitize host-coverage host-mutation

  # The coverage of the rust and meson jobs goes to Codecov. It is measured,
  # not a limit (the 100 % of the Rust programs is in the rust job), and a failed upload
  # does not fail the run. Only this job has the token; it runs nothing from
  # the tree.
  coverage:
    needs: [rust, meson]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/rust.lcov,coverage/js.lcov
          disable_search: true
          fail_ci_if_error: false

  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # The source archive, as a release makes it. The job keeps its name: the
  # check release-files / archive is required for main.
  release-files:
    uses: ./.github/workflows/release-archive.yml
