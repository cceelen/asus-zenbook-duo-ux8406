# Checks every pull request. The ruleset of main requires these checks and
# a branch that is up to date, so the tree that a merge puts on main is the
# tree that the pull request run checked: a push to main runs nothing here.
#
# Once a week the checks run on main: for what changes without a commit (new
# lints of stable Rust, new advisories), and so that pull requests find the
# caches of main.
name: ci

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch or pull request makes the older run
# pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Is the pull request a version bump and nothing else (the release pull
  # request)? Its version is set back to that of main with bump-my-version,
  # with the patterns of .bumpversion.toml; then the tree must be that of
  # main, CHANGELOG.md and the manifest of Release Please aside. Only then do
  # the jobs that need it skip: they skip on `only == 'true'` and run in every
  # other case, also when this job fails. A skipped job counts as a passed
  # required check.
  version-bump:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    outputs:
      only: ${{ steps.check.outputs.only }}
    steps:
      # The merge commit of the pull request and its first parent, main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: check
        run: |
          current() { sed -n 's/^current_version = "\(.*\)"$/\1/p'; }
          old=$(git show HEAD^1:.bumpversion.toml | current)
          new=$(current < .bumpversion.toml)
          if [ -z "$old" ] || [ "$old" = "$new" ]; then
            echo "Not a version bump."
            exit 0
          fi
          # The patterns of main, not those of the pull request: the patterns
          # of the pull request could turn any change back into main.
          if ! diff <(git show HEAD^1:.bumpversion.toml | grep -v '^current_version = ') \
                    <(grep -v '^current_version = ' .bumpversion.toml) > /dev/null; then
            echo ".bumpversion.toml changed beyond its version."
            exit 0
          fi
          if ! pipx run bump-my-version==1.5.1 bump --new-version "$old" patch --allow-dirty; then
            echo "The version could not be set back to $old."
            exit 0
          fi
          if git diff --exit-code HEAD^1 -- . ':!CHANGELOG.md' ':!.release-please-manifest.json'; then
            echo "Only the version changed: $old to $new."
            echo "only=true" >> "$GITHUB_OUTPUT"
          fi

  rust:
    needs: version-bump
    if: ${{ !cancelled() && needs.version-bump.outputs.only != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt, llvm-tools-preview
      # Prebuilt binaries: building the two from source took longer than the
      # checks.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov,cargo-about
      # The hooks cargo-fmt and cargo-clippy of .pre-commit-config.yaml, here
      # with the toolchain and its cache; the pre-commit job skips them.
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked -p asus-ux8406-tcc-guard --all-targets --features failpoints -- -D warnings
      # Every region of the guard is run by a test.
      - run: >-
          cargo llvm-cov --locked -p asus-ux8406-tcc-guard --features failpoints
          --ignore-filename-regex /tests/ --fail-under-regions 100
      # The committed notices are those of Cargo.lock. cargo-about reads the
      # crates of all programs, and the steps before got those of the guard.
      - run: cargo fetch --locked
      - run: cargo about generate --locked --offline -m keyboard-state/Cargo.toml about.hbs -o keyboard-state/THIRD-PARTY-NOTICES.txt
      - run: cargo about generate --locked --offline -m second-screen/Cargo.toml about.hbs -o second-screen/THIRD-PARTY-NOTICES.txt
      - run: cargo about generate --locked --offline -m tcc-guard/Cargo.toml about.hbs -o tcc-guard/THIRD-PARTY-NOTICES.txt
      - run: git diff --exit-code

  # The oldest Rust that a target distribution has (Debian 13). The crates of
  # Cargo.lock, those of the tests included, must compile with it. A check is
  # enough: the language and the library are those of the compiler front end.
  rust-oldest:
    needs: version-bump
    if: ${{ !cancelled() && needs.version-bump.outputs.only != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.85"
      - run: cargo check --locked --workspace --all-targets
      - run: cargo check --locked -p asus-ux8406-tcc-guard --all-targets --features failpoints

  # The weekly run on main also catches the advisories that appear without a
  # commit.
  audit:
    needs: version-bump
    if: ${{ !cancelled() && needs.version-bump.outputs.only != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false

  # Every hook of .pre-commit-config.yaml: formats, lints, spelling,
  # licences, one version in all files. cargo fmt and cargo clippy run in the
  # rust job. It runs for a version bump too.
  pre-commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The environments of the hooks, made again only when the
      # configuration changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: >-
          sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends
          clang clang-tidy libbpf-dev linux-libc-dev pipx
      - run: pipx run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: cargo-fmt,cargo-clippy
      # The release pull request has the new version in the manifest of
      # Release Please before release.yml sets it in the package files. Until
      # then it must not merge, its auto-merge being set already.
      - run: |
          manifest=$(jq -r '."."' .release-please-manifest.json)
          files=$(sed -n 's/^current_version = "\(.*\)"$/\1/p' .bumpversion.toml)
          if [ "$manifest" != "$files" ]; then
            echo "::error::.release-please-manifest.json has $manifest, .bumpversion.toml has $files."
            exit 1
          fi

  workflows:
    needs: version-bump
    if: ${{ !cancelled() && needs.version-bump.outputs.only != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true

  # Ubuntu 26.04, not -latest: the HID-BPF program needs kernel headers of 6.10
  # or later (24.04 has 6.8). The runner's user is not root, which the tests
  # need. `meson test` runs the cargo tests, the BPF object checks and the
  # extension's node tests.
  meson:
    needs: version-bump
    if: ${{ !cancelled() && needs.version-bump.outputs.only != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Meson builds the crates into build/cargo.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> build/cargo
      - run: >-
          sudo apt-get update -q && sudo apt-get install -qy --no-install-recommends
          meson ninja-build pkgconf clang libbpf-dev linux-libc-dev
          libglib2.0-bin systemd-dev udev
      - run: meson setup build
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs

  dependency-review:
    needs: version-bump
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.version-bump.outputs.only != 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # The source archive: meson dist vendors the crates with --locked, so it
  # also checks Cargo.lock of a version bump. A called workflow may not ask
  # for more permissions than its caller grants. These are for its attest
  # job, which does not run here.
  release-files:
    uses: ./.github/workflows/release-files.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
