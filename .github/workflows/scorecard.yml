# OpenSSF Scorecard: how the repository fares against the OpenSSF's checks.
# The result goes to code scanning and, in a public repository, to the
# Scorecard API for the badge of the README. Most checks are about the
# settings of the repository, not about a commit: once a week is enough.
# After a change of the settings, start a run by hand ("Run workflow").
name: scorecard

on:
  branch_protection_rule:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 2"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-26.04
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
