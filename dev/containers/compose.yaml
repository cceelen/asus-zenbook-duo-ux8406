# Local development only. Each service builds the packages of one
# distribution from this tree (dev/containers/<distro>.Dockerfile), installs
# them on a clean system and checks the installation. A container has no
# keyboard, no screens and no kernel log: this does not test the hardware.
#
# All distributions:
#   docker compose -f dev/containers/compose.yaml up --build \
#     --abort-on-container-failure
# One distribution:
#   docker compose -f dev/containers/compose.yaml up --build debian

name: asus-zenbook-duo-ux8406-packages

# The check runs dev/containers/check.sh (check-nix.sh for Nix) in the
# image; CI runs the same scripts (.github/workflows/packages.yml).
x-check: &check
  volumes:
    - ./check.sh:/check.sh:ro
    - ./check-nix.sh:/check-nix.sh:ro

services:
  fedora:
    <<: *check
    build:
      context: ../..
      dockerfile: dev/containers/fedora.Dockerfile
    command: [sh, /check.sh, fedora]
    environment:
      KEYBOARD: "yes"
      GNOME: "yes"
      KDE: "yes"

  # No udev-hid-bpf in Tumbleweed: second-screen and guard packages only.
  opensuse:
    <<: *check
    build:
      context: ../..
      dockerfile: dev/containers/opensuse.Dockerfile
    command: [sh, /check.sh, opensuse]

  # No udev-hid-bpf in Debian 13: second-screen and guard packages only.
  debian:
    <<: *check
    build:
      context: ../..
      dockerfile: dev/containers/debian.Dockerfile
      args:
        RELEASE: trixie
        KEYBOARD: "no"
    command: [sh, /check.sh, debian]

  debian-testing:
    <<: *check
    build:
      context: ../..
      dockerfile: dev/containers/debian.Dockerfile
      args:
        RELEASE: testing
        KEYBOARD: "yes"
    command: [sh, /check.sh, debian]
    environment:
      KEYBOARD: "yes"

  arch:
    <<: *check
    build:
      context: ../..
      dockerfile: dev/containers/arch.Dockerfile
    command: [sh, /check.sh, arch]
    environment:
      KEYBOARD: "yes"
      GNOME: "yes"
      KDE: "yes"

  # No udev-hid-bpf in Alpine: second-screen and guard packages only.
  alpine:
    <<: *check
    build:
      context: ../..
      dockerfile: dev/containers/alpine.Dockerfile
    command: [sh, /check.sh, alpine]

  # Nix has no install step here: the image holds the build results.
  nix:
    <<: *check
    build:
      context: ../..
      dockerfile: dev/containers/nix.Dockerfile
    command: [sh, /check-nix.sh]
