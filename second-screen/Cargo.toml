[package]
name = "asus-ux8406-second-screen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lower built-in panel of the ASUS Zenbook Duo UX8406 off while the keyboard lies on it"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Not used directly: assert_fs brings it in. Version 0.4.30 needs Rust 1.88 but
# does not declare it, and Debian 13 has 1.85. Later versions declare it, and
# cargo does not select them. Remove this line when rust-version is 1.88.
ignore = ">=0.4.25, <0.4.30"
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
rstest = "0.27"

[lints]
workspace = true
