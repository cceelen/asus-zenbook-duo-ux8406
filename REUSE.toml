# Who holds the copyright and which licence applies, said once for the whole
# tree (https://reuse.software/). Files do not repeat it. The headers copied
# from the Linux kernel carry their own notice and are taken at its word.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Christian Ceelen"
SPDX-License-Identifier = "MIT"

# The HID-BPF program: GPL-2.0-only.
[[annotations]]
path = "keyboard-bpf/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Christian Ceelen"
SPDX-License-Identifier = "GPL-2.0-only"

# Copied from the Linux kernel (drivers/hid/bpf/progs): the copyright is
# their author's, as each file says.
[[annotations]]
path = [
  "keyboard-bpf/include/hid_bpf.h",
  "keyboard-bpf/include/hid_bpf_async.h",
  "keyboard-bpf/include/hid_bpf_helpers.h",
  "keyboard-bpf/include/hid_report_descriptor_helpers.h",
]
precedence = "closest"
SPDX-FileCopyrightText = "Benjamin Tissoires"
SPDX-License-Identifier = "GPL-2.0-only"

# The protocol descriptions of KWin, as KDE publishes them: the copyright is
# that of their authors, as each file says.
[[annotations]]
path = "kde-common/protocols/*.xml"
precedence = "closest"
SPDX-FileCopyrightText = [
  "2008-2011 Kristian Høgsberg",
  "2010-2011 Intel Corporation",
  "2012-2013 Collabora, Ltd.",
  "2015 Sebastian Kügler",
  "2021 Méven Car",
  "2023 Xaver Hugl",
]
SPDX-License-Identifier = "MIT-CMU"
