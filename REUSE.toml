  "keyboard-bpf/include/hid_bpf.h",
  "keyboard-bpf/include/hid_bpf_async.h",
  "keyboard-bpf/include/hid_bpf_helpers.h",
  "keyboard-bpf/include/hid_report_descriptor_helpers.h",
