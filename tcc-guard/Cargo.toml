[package]
name = "asus-ux8406-tcc-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CPU thermal-offset guard for the thermal warning of the ASUS embedded controller"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
fail = { version = "0.5", optional = true }
log = "0.4"
rustix = { version = "1", features = ["fs", "event", "process"] }
sd-notify = "0.5"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
thiserror = "2"
toml = "1"

[features]
# Fault injection for the tests: the error paths that no arrangement of files
# reaches (see the fail crate). Not for a build that is installed.
failpoints = ["dep:fail", "fail/failpoints"]

[dev-dependencies]
# Not used directly: assert_fs brings it in. Version 0.4.30 needs Rust 1.88 but
# does not declare it, and Debian 13 has 1.85. Later versions declare it, and
# cargo does not select them. Remove this line when rust-version is 1.88.
ignore = ">=0.4.25, <0.4.30"
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
rstest = "0.27"
rustix = { version = "1", features = ["fs", "process"] }

[lints]
workspace = true
