[package]
name = "asus-ux8406-tcc-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CPU thermal-offset guard for the thermal warning of the ASUS embedded controller"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
fail = { version = "0.5", optional = true }
log = "0.4"
rustix = { version = "1", features = ["fs", "event", "process"] }
sd-notify = "0.4"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.4"
thiserror = "2"
toml = "1"

[features]
# Fault injection for the tests: the error paths that no arrangement of files
# reaches (see the fail crate). Not for a build that is installed.
failpoints = ["dep:fail", "fail/failpoints"]

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
rstest = "0.26"
rustix = { version = "1", features = ["fs", "process"] }

[lints]
workspace = true
